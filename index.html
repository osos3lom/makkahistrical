<!doctype html>
<html lang="en" dir="ltr">

    <meta charset="UTF-8" />

         indicator; the layout pays it back with env(safe-area-inset-*) padding. -->

      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8f3ec" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wadi Nakhla Atlas" />

    <title>Wadi Nakhla Atlas | أطلس وادي نخلة</title>

    <meta property="og:image:height" content="640" />
